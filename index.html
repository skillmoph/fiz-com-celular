  <!-- Openfunnel -->
  <script>
    window.openfunnel=window.openfunnel||{q:[],track:function(){this.q.push(['track',arguments])},identify:function(){this.q.push(['identify',arguments])},page:function(){this.q.push(['page',arguments])}};
  </script>
  <script async src="https://openfunnel-production.up.railway.app/of.js" data-key="of_YMrlvSeXFcFfLlFV"></script>
  <script>
    // Clique no CTA de compra (saida para o checkout Hotmart). Nome honesto: e clique, nao chegada nem compra. Sem valor monetario.
    document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[data-cta]');if(a&&window.openfunnel)openfunnel.track('clique_checkout',{cta:(a.textContent||'').trim().slice(0,60)});},true);
  </script>
  <script>
    // Preserva as UTMs e adiciona a identidade real do Openfunnel ao SCK.
    // SCK identifica o visitante; nao significa chegada ao checkout nem compra.
    (function(){
      var KEEP=['utm_source','utm_medium','utm_campaign','utm_content','utm_term','src'];
      var inc;
      try{inc=new URLSearchParams(location.search)}catch(e){return}
      var out=new URLSearchParams();
      KEEP.forEach(function(k){var v=inc.get(k);if(v)out.set(k,v)});
      function prepare(a){
        try{
          var u=new URL(a.href);
          if(u.hostname!=='pay.hotmart.com')return;
          out.forEach(function(v,k){u.searchParams.set(k,v)});
          var sdk=window.openfunnel;
          var id=sdk&&typeof sdk.visitorId==='function'?sdk.visitorId():null;
          if(typeof id==='string'&&/^[A-Za-z0-9_-]{4,64}$/.test(id))u.searchParams.set('sck','of_vid:'+id);
          a.href=u.toString();
        }catch(e){}
      }
      function rewrite(){document.querySelectorAll('a[data-cta]').forEach(prepare)}
      if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',rewrite);else rewrite();
      // O SDK e assincrono: cobre tanto carregamento cedo como tardio.
      var loader=document.querySelector('script[src="https://openfunnel-production.up.railway.app/of.js"]');
      if(loader)loader.addEventListener('load',rewrite);
      document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[data-cta]');if(a)prepare(a)},true);
      // A pagina renderiza por React: cobre CTAs que entram no DOM depois do carregamento.
      new MutationObserver(function(){rewrite()}).observe(document.documentElement,{childList:true,subtree:true});
    })();
  </script>
